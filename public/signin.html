<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk — Justice API</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b1826;
        --bg-2: #0e2033;
        --panel: #122a42;
        --panel-2: #0f2338;
        --line: #22405e;
        --line-soft: #1a3350;
        --text: #e9f2fa;
        --muted: #7f9bb8;
        --muted-2: #5b7896;
        --amber: #ffb454;
        --green: #7be0a0;
        --red: #ff6b6b;
        --mono: "IBM Plex Mono", ui-monospace, monospace;
        --sans: "IBM Plex Sans", system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        font-family: var(--sans);
        background: linear-gradient(180deg, var(--bg) 0%, #091320 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: inherit;
      }
      .card {
        width: 100%;
        max-width: 380px;
        margin: 16px;
        padding: 30px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-family: var(--mono);
        font-weight: 700;
        letter-spacing: 0.05em;
        font-size: 15px;
        margin-bottom: 26px;
      }
      .brand .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--amber);
        box-shadow: 0 0 8px var(--amber);
      }
      h1 {
        font-family: var(--mono);
        font-size: 17px;
        margin: 0 0 6px;
      }
      p.desc {
        color: var(--muted);
        font-size: 13px;
        margin: 0 0 22px;
      }

      .oauth-btn {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 11px 16px;
        margin-bottom: 10px;
        border-radius: 6px;
        cursor: pointer;
        font-family: var(--sans);
        font-size: 13.5px;
        font-weight: 600;
        text-decoration: none;
        border: 1px solid var(--line);
        transition:
          border-color 0.15s,
          transform 0.1s;
      }
      .oauth-btn:hover {
        transform: translateY(-1px);
      }
      .oauth-btn.google {
        background: var(--text);
        color: #1a1a1a;
        border-color: var(--text);
      }
      .oauth-btn.google:hover {
        filter: brightness(0.95);
      }
      .oauth-btn.github {
        background: #0f1420;
        color: var(--text);
        border-color: var(--line);
      }
      .oauth-btn.github:hover {
        border-color: var(--muted);
      }
      .oauth-btn svg {
        flex: none;
      }
      .oauth-btn.disabled {
        opacity: 0.45;
        cursor: not-allowed;
        pointer-events: none;
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 18px 0;
        color: var(--muted-2);
        font-size: 11px;
        font-family: var(--mono);
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }

      #msg {
        margin-bottom: 14px;
      }
      .msg {
        padding: 9px 11px;
        border-radius: 5px;
        font-size: 12.5px;
        margin-bottom: 8px;
      }
      .msg.error {
        background: rgba(255, 107, 107, 0.1);
        border: 1px solid rgba(255, 107, 107, 0.35);
        color: var(--red);
      }

      .back {
        display: block;
        margin-top: 18px;
        font-size: 12.5px;
        text-align: center;
        color: var(--muted-2);
        text-decoration: none;
      }
      .back:hover {
        color: var(--amber);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand"><span class="dot"></span>JUSTICE_API</div>
      <h1>Masuk buat lihat Docs</h1>
      <p class="desc">
        Dokumentasi &amp; playground Justice API cuma bisa diakses setelah login. Pilih salah satu:
      </p>

      <div id="msg"></div>

      <a id="googleBtn" class="oauth-btn google" href="#">
        <svg width="18" height="18" viewBox="0 0 48 48">
          <path
            fill="#FFC107"
            d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"
          />
          <path
            fill="#FF3D00"
            d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16 4 9 8.5 6.3 14.7z"
          />
          <path
            fill="#4CAF50"
            d="M24 44c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.6 35.3 26.9 36 24 36c-5.3 0-9.7-3.4-11.3-8.1l-6.6 5.1C9 39.4 16 44 24 44z"
          />
          <path
            fill="#1976D2"
            d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.6 5.4C41.6 35.6 44 30.3 44 24c0-1.3-.1-2.7-.4-3.5z"
          />
        </svg>
        <span>Masuk dengan Google</span>
      </a>
      <a id="githubBtn" class="oauth-btn github" href="#">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor">
          <path
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"
          />
        </svg>
        <span>Masuk dengan GitHub</span>
      </a>

      <div class="divider">ATAU</div>
      <p class="desc" style="margin-bottom: 6px">
        Punya akses admin? <a href="/login.html" style="color: var(--amber)">Login pakai Admin API Key →</a>
      </p>

      <a class="back" href="/features.html">← Balik ke halaman fitur</a>
    </div>

    <script>
      (function () {
        const params = new URLSearchParams(location.search);
        const next = params.get("next") || "/index.html";
        const error = params.get("error");

        const errMsg = {
          google_failed: "Login Google gagal atau dibatalkan. Coba lagi.",
          github_failed: "Login GitHub gagal atau dibatalkan. Coba lagi.",
          google_disabled:
            "Login Google belum diaktifkan di server ini (GOOGLE_CLIENT_ID/SECRET belum di-set).",
          github_disabled:
            "Login GitHub belum diaktifkan di server ini (GITHUB_CLIENT_ID/SECRET belum di-set).",
        };
        if (error && errMsg[error]) {
          document.getElementById("msg").innerHTML = `<div class="msg error">${errMsg[error]}</div>`;
        }

        document.getElementById("googleBtn").href = "/auth/google?next=" + encodeURIComponent(next);
        document.getElementById("githubBtn").href = "/auth/github?next=" + encodeURIComponent(next);

        // Kalau ternyata udah login (mis. buka /signin.html manual padahal sesi
        // masih hidup), langsung lempar ke tujuan biar gak keliatan aneh diam
        // di halaman login.
        fetch("/auth/me")
          .then((r) => r.json())
          .then((d) => {
            if (d.user) location.href = next;
          })
          .catch(() => {});
      })();
    </script>
  </body>
</html>
