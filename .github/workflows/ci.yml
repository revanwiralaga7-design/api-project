name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # clients.json (API key asli) sengaja di-gitignore — test yang butuh
      # bakal nulis sendiri lewat CLIENTS_PATH/tmp, gak perlu file beneran.
      - name: Run tests
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=high
